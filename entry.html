<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ввод платежей · аренда авто</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --ink:#1c2530; --muted:#6b7785; --line:#e6e9ee;
    --neg:#c0392b; --pos:#1e8449; --accent:#2563eb; --accentbg:#eef3ff; --warn:#b9770e;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.45 -apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  header{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
  h1{font-size:16px;margin:0;font-weight:650}
  .spacer{flex:1}
  a.link{color:var(--accent);text-decoration:none;font-size:13px}
  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 16px}
  .dsel{display:flex;flex-direction:column;gap:3px}
  .dsel label{font-size:11px;color:var(--muted)}
  .dsel input{border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:14px;min-width:240px}
  .months{display:flex;gap:6px;flex-wrap:wrap}
  .mbtn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 12px;cursor:pointer;color:var(--ink)}
  .mbtn.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .wrap{max-width:520px;margin:0 auto;padding:6px 16px 40px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .dhead{padding:14px 16px;border-bottom:1px solid var(--line)}
  .dhead .nm{font-size:17px;font-weight:700}
  .dhead .meta{color:var(--muted);font-size:13px;margin-top:3px;display:flex;gap:14px;flex-wrap:wrap}
  .frozenbadge{display:inline-block;background:#fef6e7;color:var(--warn);border-radius:6px;padding:1px 7px;font-size:12px}
  .daytable{width:100%;border-collapse:collapse}
  .daytable td{border-top:1px solid var(--line);padding:0}
  .drow{display:flex;align-items:center;cursor:pointer}
  .drow:hover{background:var(--accentbg)}
  .dnum{width:46px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums;padding:9px 0;border-right:1px solid var(--line)}
  .dval{flex:1;padding:9px 14px;font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
  .drow.empty .dval{color:#c4cdd6;font-weight:400}
  .drow.empty .dval::after{content:'+ внести'}
  .dval .void{color:var(--muted);text-decoration:line-through;font-weight:400;margin-left:6px;font-size:12px}
  .totbar{display:flex;justify-content:space-between;padding:14px 16px;border-top:2px solid var(--line);background:#fbfcfd}
  .tot{display:flex;flex-direction:column}
  .tot .l{font-size:12px;color:var(--muted)}
  .tot .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
  .neg{color:var(--neg)} .pos{color:var(--pos)}
  .empty-state{padding:40px 16px;text-align:center;color:var(--muted)}
  /* popover */
  .ov{position:fixed;inset:0;background:rgba(20,28,38,.28);display:none;z-index:50}
  .ov.show{display:block}
  .pop{position:absolute;background:#fff;border:1px solid var(--line);border-radius:12px;
    box-shadow:0 12px 40px rgba(20,28,38,.22);width:300px;padding:14px}
  .pop h3{margin:0 0 2px;font-size:14px}
  .pop .sub{color:var(--muted);font-size:12px;margin-bottom:10px}
  .plist{margin:0 0 6px;max-height:150px;overflow:auto}
  .prow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0;border-top:1px solid var(--line)}
  .prow.void .amt{text-decoration:line-through;color:var(--muted)}
  .void-btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:2px 7px;cursor:pointer;color:var(--neg);font-size:12px}
  .addrow{display:flex;gap:6px;margin-top:8px}
  .addrow input{flex:1;border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:15px}
  .addrow button{border:0;background:var(--accent);color:#fff;border-radius:7px;padding:8px 13px;cursor:pointer;font-weight:600}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1c2530;color:#fff;
    padding:9px 16px;border-radius:9px;opacity:0;transition:opacity .2s;z-index:60;font-size:13px}
  .toast.show{opacity:1}
  .err{color:var(--neg);font-size:12px;margin-top:6px;min-height:14px}
</style>
</head>
<body>
<header>
  <h1>Ввод платежей</h1>
  <div class="spacer"></div>
  <a class="link" href="/">← Дашборд</a>
</header>

<div class="controls">
  <div class="dsel">
    <label>Водитель</label>
    <input id="driver" list="drivers" placeholder="Начните вводить фамилию…" autocomplete="off">
    <datalist id="drivers"></datalist>
  </div>
  <div class="dsel">
    <label>Месяц</label>
    <div class="months" id="months"></div>
  </div>
</div>

<div class="wrap">
  <div id="view"></div>
</div>

<div class="ov" id="ov"><div class="pop" id="pop"></div></div>
<div class="toast" id="toast"></div>

<script>
let state={drivers:[],months:[],driverId:null,year:null,month:null,data:null};

const fmt=n=>(Math.round(n||0)).toLocaleString('ru-RU');
const money=n=>n<0?'−'+fmt(Math.abs(n)):fmt(n);
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}

async function api(path,opts){
  const r=await fetch(path,opts);
  if(!r.ok){let d={};try{d=await r.json()}catch(e){}; throw new Error(d.detail||('Ошибка '+r.status))}
  return r.status===204?null:r.json();
}

async function init(){
  const [model,drivers]=await Promise.all([api('/api/model'),api('/api/drivers')]);
  state.months=(model.months||[]).map(x=>({y:x.year,mo:x.month+1,label:x.label}));
  state.drivers=drivers;
  const dl=document.getElementById('drivers');
  dl.innerHTML=drivers.map(d=>`<option value="${d.name}${d.car?' · '+d.car:''}" data-id="${d.id}">`).join('');
  const box=document.getElementById('months');box.innerHTML='';
  state.months.forEach(m=>{
    const b=document.createElement('button');b.className='mbtn';b.textContent=m.label;b.dataset.key=m.y+'-'+m.mo;
    b.onclick=()=>{state.year=m.y;state.month=m.mo;syncMonthBtns();load()};box.appendChild(b);
  });
  const cur=state.months[state.months.length-1];
  if(cur){state.year=cur.y;state.month=cur.mo;syncMonthBtns()}
  document.getElementById('driver').addEventListener('input',onDriverInput);
}
function syncMonthBtns(){document.querySelectorAll('.mbtn').forEach(b=>b.classList.toggle('active',b.dataset.key===state.year+'-'+state.month))}

function onDriverInput(e){
  const val=e.target.value;
  // сопоставляем по тексту опции (имя · авто)
  const d=state.drivers.find(x=>(x.name+(x.car?' · '+x.car:''))===val) || state.drivers.find(x=>x.name===val);
  if(d){state.driverId=d.id;load()}
}

async function load(){
  if(!state.driverId||!state.year){document.getElementById('view').innerHTML='<div class="empty-state">Выберите водителя и месяц</div>';return}
  try{
    state.data=await api(`/api/driver_month?driver_id=${state.driverId}&year=${state.year}&month=${state.month}`);
    render();
  }catch(e){document.getElementById('view').innerHTML=`<div class="empty-state">${e.message}</div>`}
}

function cellPaid(arr){return (arr||[]).filter(p=>!p.voided&&p.source!=='buyout').reduce((s,p)=>s+p.amount,0)}

function render(){
  const d=state.data;const v=document.getElementById('view');
  if(!d.exists){
    v.innerHTML=`<div class="card"><div class="dhead"><div class="nm">${d.name||''}</div>
      <div class="meta">Нет данных за ${d.label}</div></div></div>`;return;
  }
  let rows='';
  for(let day=1;day<=d.daysInMonth;day++){
    const arr=d.days[String(day)]||[];const paid=cellPaid(arr);
    const voidTxt=arr.some(p=>p.voided)&&!paid?`<span class="void">аннулир.</span>`:'';
    rows+=`<tr><td><div class="drow ${paid?'':'empty'}" data-day="${day}">
      <div class="dnum">${day}</div><div class="dval">${paid?fmt(paid):''}${voidTxt}</div></div></td></tr>`;
  }
  v.innerHTML=`<div class="card">
    <div class="dhead">
      <div class="nm">${d.name} ${d.status==='frozen'?'<span class="frozenbadge">заморожен</span>':''}</div>
      <div class="meta"><span>${d.car||'без номера'}</span><span>ставка ${fmt(d.daily_rate)}/сут</span><span>обязат. ${fmt(d.obligation)}/мес</span></div>
    </div>
    <table class="daytable"><tbody>${rows}</tbody></table>
    <div class="totbar">
      <div class="tot"><span class="l">Итого внесено</span><span class="v">${fmt(d.paid)} ₽</span></div>
      <div class="tot" style="text-align:right"><span class="l">Остаток</span><span class="v ${d.balance<0?'neg':'pos'}">${money(d.balance)} ₽</span></div>
    </div>
  </div>`;
  v.querySelectorAll('.drow').forEach(r=>r.onclick=e=>openDay(+r.dataset.day,r));
}

function openDay(day,rowEl){
  const d=state.data;const arr=d.days[String(day)]||[];
  const date=`${d.year}-${String(d.month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  const pop=document.getElementById('pop');
  let lst=arr.map(p=>`<div class="prow${p.voided?' void':''}"><span class="amt">${fmt(p.amount)} ₽${p.voided?' (аннулир.)':''}</span>${p.voided?'':`<button class="void-btn" data-pid="${p.id}">аннулировать</button>`}</div>`).join('');
  if(!arr.length) lst='<div class="sub" style="padding:2px 0">платежей нет</div>';
  pop.innerHTML=`<h3>${d.name} · ${day}.${String(d.month).padStart(2,'0')}.${d.year}</h3>
    <div class="sub">${d.car||''}</div>
    <div class="plist">${lst}</div>
    <div class="addrow"><input id="amt" type="number" inputmode="numeric" placeholder="Сумма ₽" autocomplete="off"><button id="add">Внести</button></div>
    <div class="err" id="err"></div>`;
  const ov=document.getElementById('ov');ov.classList.add('show');
  const r=rowEl.getBoundingClientRect();
  pop.style.left=Math.max(8,Math.min(r.left,window.innerWidth-316))+'px';
  pop.style.top=Math.max(8,Math.min(r.bottom+6,window.innerHeight-240))+'px';
  const amt=document.getElementById('amt');amt.focus();
  const submit=async()=>{
    const val=parseFloat(amt.value);
    if(!val){document.getElementById('err').textContent='Введите сумму';return}
    try{
      await api('/api/payments',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({rental_month_id:d.rental_month_id,amount:val,paid_at:date})});
      close();toast(`+${fmt(val)} ₽`);await load();
    }catch(e){document.getElementById('err').textContent=e.message}
  };
  document.getElementById('add').onclick=submit;
  amt.onkeydown=e=>{if(e.key==='Enter')submit();if(e.key==='Escape')close()};
  pop.querySelectorAll('.void-btn').forEach(b=>b.onclick=async()=>{
    const p=arr.find(x=>x.id==b.dataset.pid);
    if(!confirm('Аннулировать платёж '+fmt(p.amount)+' ₽?'))return;
    try{await api(`/api/payments/${b.dataset.pid}/void`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
      close();toast('Платёж аннулирован');await load();
    }catch(e){document.getElementById('err').textContent=e.message}
  });
}
function close(){document.getElementById('ov').classList.remove('show')}
document.getElementById('ov').onclick=e=>{if(e.target.id==='ov')close()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});

init();
</script>
</body>
</html>
